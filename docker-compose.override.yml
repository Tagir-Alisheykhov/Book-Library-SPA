services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: library_api:local_dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DEBUG: "True"
      POSTGRES_HOST: db
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      python manage.py runserver 0.0.0.0:8000
      "

  web:
    ports:
      - "8001:80"
